name: Update Shadowrocket rules

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shadowrocket-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download, build, and validate rules
        run: python3 scripts/update_rules.py

      - name: Commit updated rules
        run: |
          if git diff --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules Shadowrocket-Rules.conf
          git commit -m "chore: update Shadowrocket rules"
          git push
